---
default:
  # Job images are pinned by digest; bump only to tags pushed over a week ago.
  image: docker.io/library/python:3.12.14@sha256:4d1caded1f729ae443eb803f26ffde7b61e696aeaef62f099abb6dd6b14257c7
  tags: ['new-runner']

stages:
  - build-image
  - analysis-and-tests
  - security
  - ci-pipeline

# No merge request pipelines: the bare `when:` rules below would otherwise
# also spawn one for every push to a branch with an open MR.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

# the nightly schedule (CI/CD > Schedules) runs only pip-audit
.not-on-schedule: &not_on_schedule
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - when: on_success

# base for the Python jobs; every pip install obeys requirements-ci.txt's pins
.python-job:
  needs: []
  rules: *not_on_schedule
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_CONSTRAINT: "$CI_PROJECT_DIR/requirements-ci.txt"
  cache:
    key:
      files:
        - requirements.txt
        - requirements-ci.txt
    paths:
      - .cache/pip
    policy: pull

# a recompiled requirements.txt needs requirements-ci.txt recompiled too;
# report that in one line instead of a resolver conflict in three jobs
requirements-sync:
  stage: analysis-and-tests
  needs: []
  rules: *not_on_schedule
  script:
    - |
      python3 - <<'EOF'
      import re, sys
      def pins(path):
          return {n.lower().replace("_", "-").replace(".", "-"): v
                  for n, v in re.findall(r"^([A-Za-z0-9_.\-]+)(?:\[[^\]]*\])?==(\S+)", open(path).read(), re.M)}
      app, ci = pins("requirements.txt"), pins("requirements-ci.txt")
      shared = app.keys() & ci.keys()
      stale = {n: (app[n], ci[n]) for n in shared if app[n] != ci[n]}
      for n, (a, c) in sorted(stale.items()):
          print(f"{n}: requirements.txt pins {a}, requirements-ci.txt pins {c}")
      if stale:
          sys.exit("requirements-ci.txt is stale; recompile it (see requirements-ci.in)")
      print(f"requirements-ci.txt agrees with requirements.txt on {len(shared)} shared pins")
      EOF

flake8:
  extends: .python-job
  stage: analysis-and-tests
  script:
    - pip install flake8
    - flake8 pebbles tests manage.py

pylint:
  extends: .python-job
  stage: analysis-and-tests
  script:
    - pip install -r requirements.txt pylint
    - "pylint -j0 pebbles || true" # no failures ATM

tests:
  extends: .python-job
  stage: analysis-and-tests
  variables:
    FLASK_APP: pebbles.server:app
  cache:
    # the one job that refreshes the pip cache
    policy: pull-push
  script:
    - pip install -r requirements.txt
    - python manage.py test

pip-audit:
  extends: .python-job
  stage: security
  rules:
    # the nightly schedule (CI/CD > Schedules) is the enforcing run
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # everywhere else findings only warn
    - when: on_success
      allow_failure: true
  variables:
    # Example: "ID|expiry-date|reason, ID|expiry-date|reason, ID|expiry-date|reason"
    # ignore specific IDs only, not whole packages
    # Define this in CI/CD variables
    CI_PIP_AUDIT_ALLOWLIST: ""
  script:
    - pip install -r requirements.txt pip-audit
    - |
      set -euo pipefail

      today="$(date -I)"  # YYYY-MM-DD
      IGNORE_ARGS=()
      IGNORED_COUNT=0

      if [ -n "${CI_PIP_AUDIT_ALLOWLIST:-}" ]; then
        # Split by commas
        IFS=',' read -ra entries <<< "${CI_PIP_AUDIT_ALLOWLIST}"
        for entry in "${entries[@]}"; do
          # Trim spaces
          entry="$(echo "$entry" | xargs)"
          # Split by '|'
          IFS='|' read -r id expires reason <<< "$entry"
          id="$(echo "$id" | xargs)"
          expires="$(echo "$expires" | xargs)"
          reason="$(echo "$reason" | xargs)"

          if [ -z "$id" ] || [ -z "$expires" ]; then
            echo "WARN: malformed allowlist entry: $entry"
            continue
          fi

          if [[ "$expires" > "$today" ]]; then
            IGNORE_ARGS+=("--ignore-vuln" "$id")
            IGNORED_COUNT=$((IGNORED_COUNT+1))
            echo "Ignoring $id until $expires (${reason:-no reason})"
          else
            echo "Allowlist expired for $id on $expires; not ignoring."
          fi
        done
      fi

      echo "Running pip-audit (file-based) – applying ${IGNORED_COUNT} ignore(s)"
      pip-audit --no-deps --disable-pip -r requirements.txt "${IGNORE_ARGS[@]}"

      echo "Running pip-audit (environment-based) – applying ${IGNORED_COUNT} ignore(s)"
      pip-audit "${IGNORE_ARGS[@]}"

bandit-scan:
  extends: .python-job
  stage: security
  variables:
    # Example: "ID|expiry-date|reason, ID|expiry-date|reason, ID|expiry-date|reason"
    # Define this in CI/CD variables
    CI_BANDIT_ALLOWLIST: ""
    # include other needed files
    CI_BANDIT_EXCLUDES: "./migrations,./tests"
  script:
    - pip install bandit
    - |
      set -euo pipefail

      today="$(date -I)"  # YYYY-MM-DD
      SKIPS=()
      IGNORED_COUNT=0

      if [ -n "${CI_BANDIT_ALLOWLIST:-}" ]; then
        IFS=',' read -ra entries <<< "${CI_BANDIT_ALLOWLIST}"
        for entry in "${entries[@]}"; do
          entry="$(echo "$entry" | xargs)"
          [ -z "$entry" ] && continue
          IFS='|' read -r id expires reason <<< "$entry"
          id="$(echo "${id:-}" | xargs | tr '[:lower:]' '[:upper:]')"
          expires="$(echo "${expires:-}" | xargs)"
          reason="$(echo "${reason:-}" | xargs)"

          if [ -z "$id" ] || [ -z "$expires" ]; then
            echo "WARN: malformed allowlist entry: '$entry' (need ID|expiry|reason)"
            continue
          fi
          if ! [[ "$id" =~ ^B[0-9]{3}$ ]]; then
            echo "WARN: '$id' does not look like a Bandit test id (e.g., B311). Skipping."
            continue
          fi

          if [[ "$expires" > "$today" ]]; then
            SKIPS+=("$id")
            IGNORED_COUNT=$((IGNORED_COUNT+1))
            echo "Skipping $id until $expires (${reason:-no reason})"
          else
            echo "Allowlist expired for $id on $expires; not skipping."
          fi
        done
      fi

      # Bandit expects a single comma-separated string for -s, like -s "B311,B113".
      # We join the array into SKIP_CSV using a temporary IFS=,.
      # If no active skips, we do not add -s.
      BANDIT_SKIP_OPT=()
      if [ ${#SKIPS[@]} -gt 0 ]; then
        SKIP_CSV="$(IFS=, ; echo "${SKIPS[*]}")"
        BANDIT_SKIP_OPT=(-s "$SKIP_CSV")
        echo "Bandit will skip: $SKIP_CSV"
      fi

      # directories to skip
      BANDIT_EXCLUDE_OPT=()
      if [ -n "${CI_BANDIT_EXCLUDES:-}" ]; then
        EX_CSV="$(echo "$CI_BANDIT_EXCLUDES" | sed 's/[[:space:]]//g')"
        BANDIT_EXCLUDE_OPT=(-x "$EX_CSV")
        echo "Bandit will exclude: $EX_CSV"
      fi

      echo "Running Bandit – ${IGNORED_COUNT} active skip(s)"
      bandit -r . \
        "${BANDIT_SKIP_OPT[@]}" \
        "${BANDIT_EXCLUDE_OPT[@]}" \
        --severity-level "medium"

build-image:
  tags: ['ci-privileged']
  stage: build-image
  needs: []
  rules: *not_on_schedule
  image:
    # v0.33.0-rootless; the tag is spelled to match ci-privileged's allow-list
    name: docker.io/moby/buildkit:rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
  variables:
    DOCKER_CONFIG: /tmp/.docker
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - ln -s /run/secrets/runner-job-secrets/docker_config_ci.json "$DOCKER_CONFIG/config.json"
    - |
      buildctl-daemonless.sh build \
        --frontend=dockerfile.v0 \
        --local context="${CI_PROJECT_DIR}" \
        --local dockerfile="${CI_PROJECT_DIR}" \
        --opt filename="deployment/pebbles.Dockerfile" \
        --output type=image,name="${CI_IMAGE_REPO_CI}/pebbles:${CI_COMMIT_REF_NAME}",push=true \
        ${CI_BUILDKIT_CACHE_OPTIONS}

# call pipeline project
ci-pipeline:
  stage: ci-pipeline
  needs: ['build-image']
  rules: *not_on_schedule
  variables:
    PEBBLES_IMAGE_TAG: "${CI_COMMIT_REF_NAME}"
    PEBBLES_COMMIT_REF_NAME: "${CI_COMMIT_REF_NAME}"
    PEBBLES_ENVIRONMENTS_COMMIT_REF_NAME: "${CI_COMMIT_REF_NAME}"
    PEBBLES_DEPLOY_COMMIT_REF_NAME: "${CI_COMMIT_REF_NAME}"
  trigger:
    project: pebbles/cicd-pipeline
    branch: main
    strategy: depend
